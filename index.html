<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholetrain | Türkçe Altyazılı</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
        }
        p {
            color: #777;
            margin-bottom: 20px;
            font-size: 14px;
        }
        /* Oynatıcı Değiştirme Butonları */
        .player-selectors {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .player-btn {
            background-color: #1a1a1a;
            color: #aaa;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .player-btn:hover {
            background-color: #262626;
            color: #fff;
        }
        .player-btn.active {
            background-color: #ff4500;
            color: #fff;
            border-color: #ff4500;
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.4);
        }
        /* Video Alanı */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Oranı */
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 1px solid #222;
        }
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        .video-wrapper.active {
            display: block;
        }
        .video-wrapper video,
        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: contain;
            background: #000;
        }
        footer {
            margin-top: 30px;
            color: #555;
            font-size: 13px;
        }
        footer span {
            color: #ff4500;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wholetrain</h1>
        <p>Türkçe Altyazılı Kült Film</p>
        <p>İYİ SEYİRLER DİLERİM!</p>
        <p style="color: #DC143C;">LONG LIVE HIP-HOP</p>

        <!-- Platform Seçim Butonları -->
        <div class="player-selectors">
            <button class="player-btn active" onclick="switchPlayer('archive', this)">▶ Ana Oynatıcı (Hızlı & Sade)</button>
            <button class="player-btn" onclick="switchPlayer('okru', this)">▶ Alternatif (OK.ru)</button>
        </div>

        <!-- Video Çerçevesi -->
        <div class="video-container">
            <!-- Özel HTML5 Video Oynatıcısı (Varsayılan olarak açık) -->
            <div id="archive-player" class="video-wrapper active">
                <video controls controlsList="nodownload" preload="metadata">
                    <source src="https://archive.org/download/wholetrain-turkce-altyazi/Wholetrain%20T%C3%BCrk%C3%A7e%20Altyaz%C4%B1%201080P%20Hd%20%281080P%2030Fps%20H264-128Kbit%20Aac%29.mp4" type="video/mp4">
                    Tarayıcınız video etiketini desteklemiyor.
                </video>
            </div>

            <!-- OK.ru Oynatıcısı (Alternatif) -->
            <div id="okru-player" class="video-wrapper">
                <iframe src="https://ok.ru/videoembed/17366610152093?nochat=1" allow="autoplay; fullscreen" allowfullscreen="true"></iframe>
            </div>
        </div>
    </div>

    <footer>
        Çeviri & Düzenleme: <span>HASK</span>
        <div> <a href="https://instagram.com/haskwashere" target="_blank">Instagram Hesabım</a></div>
    </footer>
    </footer>

    <script>
        function switchPlayer(playerType, btnElement) {
            // Arşiv oynatıcısındaki videoyu durdur (arka planda ses çalmaya devam etmesin)
            const videoEl = document.querySelector('#archive-player video');
            if (videoEl) {
                videoEl.pause();
            }

            // Tüm oynatıcıları gizle
            document.querySelectorAll('.video-wrapper').forEach(el => el.classList.remove('active'));
            // Tüm butonların aktifliğini kaldır
            document.querySelectorAll('.player-btn').forEach(el => el.classList.remove('active'));

            // Seçilen oynatıcıyı aç ve butonu turuncu yap
            if (playerType === 'archive') {
                document.getElementById('archive-player').classList.add('active');
            } else if (playerType === 'okru') {
                document.getElementById('okru-player').classList.add('active');
            }
            btnElement.classList.add('active');
        }
    </script>

</body>
</html>
