<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholetrain | Türkçe Altyazılı</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
        }
        p {
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Oranı */
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            border: 1px solid #222;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        footer {
            margin-top: 30px;
            color: #555;
            font-size: 13px;
        }
        footer span {
            color: #ff4500;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wholetrain</h1>
        <p>Türkçe Altyazılı Kült Film</p>

        <div class="video-container">
            <iframe src="https://archive.org/embed/wholetrain-turkce-altyazi" frameborder="0" webkitallowfullscreen="true" mozallowfullscreen="true" allowfullscreen></iframe>
        </div>
    </div>

    <footer>
        Çeviri & Düzenleme: <span>HASK</span>
    </footer>

</body>
</html>
